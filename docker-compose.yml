services:
  mysql:
    image: mysql:8.0
    container_name: sistema-cosmeticos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_cosmeticos
      MYSQL_USER: cosmeticos
      MYSQL_PASSWORD: cosmeticos123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/002_seeds.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Adminer e somente uma interface local para inspecionar tabelas do MySQL durante desenvolvimento.
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
