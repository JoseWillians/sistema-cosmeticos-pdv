services:
  postgres:
    image: postgres:16
    container_name: sistema-cosmeticos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_cosmeticos
      POSTGRES_USER: cosmeticos
      POSTGRES_PASSWORD: cosmeticos123
    ports:
      # A porta local 5433 evita conflito com PostgreSQL instalado no Windows.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/postgres/seeds.sql:/docker-entrypoint-initdb.d/002_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmeticos -d sistema_cosmeticos"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Adminer e somente uma interface local para inspecionar tabelas do PostgreSQL durante desenvolvimento.
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
